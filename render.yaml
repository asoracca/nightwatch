# Review Render's quoted costs before deploying. Worker requires a paid plan.
services:
  - type: web
    name: nightwatch-api
    runtime: docker
    repo: https://github.com/asoracca/nightwatch
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
  - type: worker
    name: nightwatch-worker
    runtime: docker
    repo: https://github.com/asoracca/nightwatch
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m nightwatch.worker
    plan: 1c-2g
    autoDeployTrigger: off
    envVars:
      - key: SUPABASE_URL
        fromService:
          type: web
          name: nightwatch-api
          envVarKey: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromService:
          type: web
          name: nightwatch-api
          envVarKey: SUPABASE_ANON_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: nightwatch-api
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
