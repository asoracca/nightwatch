services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  worker:
    build: ./backend
    command: python -m nightwatch.worker
    env_file: ./backend/.env
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
