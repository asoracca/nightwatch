<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nightwatch-mark.svg" />
    <!-- Fonts: preconnect + one stylesheet (loaded here rather than via CSS @import to save a round trip). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090617" />
    <meta
      name="description"
      content="NightWatch — an intelligence workspace for monitoring and investigation."
    />
    <title>NightWatch — Intelligence Workspace</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: matches the launch intro's first frame, so React taking over is invisible. -->
      <div style="position:fixed;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,#0b0c16 0%,#05050b 70%)"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
